spring:
  application:
    name: backend-new
  datasource:
    url: jdbc:postgresql://localhost:5433/fitvision_db
    username: fitvision_user
    password: fitvision_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3 # 1 tried + 2 retried
          multiplier: 2.0
    host: localhost
    port: 5672
    username: fitvision_user
    password: fitvision_password
aws:
  endpoint: http://localhost:9010
  access-key: admin
  secret-key: admin123
  bucket: fitvision-uploads
  region: us-east-1
ml:
  api:
    url: http://localhost:8000
