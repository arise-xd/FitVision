name: fitvision
description: "FitVision Android frontend for exercise video capture and analysis results."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.1.3

  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  camera_platform_interface: ^2.15.0

flutter:
  uses-material-design: true
