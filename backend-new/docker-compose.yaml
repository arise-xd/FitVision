services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-example
    user: "0:0"
    command: server /data --address ":9010" --console-address ":9011"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9010:9010"   # S3 API
      - "9011:9011"   # Web-console
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 1024m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  postgres:
    image: postgres:16-alpine
    container_name: fitvision-postgres
    environment:
      POSTGRES_USER: fitvision_user
      POSTGRES_PASSWORD: fitvision_password
      POSTGRES_DB: fitvision_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fitvision-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fitvision_user
      RABBITMQ_DEFAULT_PASS: fitvision_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
volumes:
  minio-data:
  postgres-data:
  rabbitmq-data:
