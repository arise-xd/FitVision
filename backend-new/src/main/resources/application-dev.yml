spring:
  application:
    name: backend-new
  datasource:
    url: jdbc:postgresql://localhost:5433/fitvision_db
    username: fitvision_user
    password: fitvision_password
  jpa:
    hibernate:
      ddl-auto: update # changed on "validate" when set up Flyway
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: fitvision_user
    password: fitvision_password
aws:
  endpoint: http://localhost:9010
  access-key: admin
  secret-key: admin123
  bucket: fitvision-uploads
  region: us-east-1
